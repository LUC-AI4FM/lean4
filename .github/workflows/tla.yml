name: TLA port
on:
  push:
    paths: ['tla/**', '.github/workflows/tla.yml']
  pull_request:
    paths: ['tla/**', '.github/workflows/tla.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Install elan
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check native and source specifications
        working-directory: tla
        run: |
          python3 tools.py
          python3 check.py
  universal:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install elan
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch pinned set-theory dependencies
        working-directory: tla/universal
        run: |
          lake update
          lake exe cache get
      - name: Check universal-value semantics
        working-directory: tla/universal
        run: |
          python3 ../tools.py
          python3 check.py
