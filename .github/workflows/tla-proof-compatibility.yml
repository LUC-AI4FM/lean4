name: TLAPS unchanged proof audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: tlaplus/tlapm
          ref: d1760ab9a1a3e7e76f81172166a955167cd163f2
          path: reference-tlapm
      - uses: actions/checkout@v5
        with:
          repository: tlaplus/CommunityModules
          ref: 1805e9d5e1cef05d74806309fb87788e69b48f26
          path: reference-community
      - name: Install elan
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build port
        working-directory: tla/universal
        run: |
          lake update
          lake exe cache get
          lake build
          python3 ../tools.py
      - name: Check unchanged proof scripts
        working-directory: tla
        run: |
          python3 proof_compatibility.py ../reference-tlapm --reference-manifest tests/proofs/reference-baseline.json -I ../reference-community/modules --shard ${{ matrix.shard }} --shards 8 --report ../proof-compatibility-report/${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tlaps-proof-compatibility-${{ matrix.shard }}
          path: proof-compatibility-report/*.json
          if-no-files-found: warn
