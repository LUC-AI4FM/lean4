name: TLAPS reference proof baseline
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: tlaplus/tlapm
          ref: d1760ab9a1a3e7e76f81172166a955167cd163f2
          path: reference-tlapm
      - uses: actions/checkout@v5
        with:
          repository: tlaplus/CommunityModules
          ref: 1805e9d5e1cef05d74806309fb87788e69b48f26
          path: reference-community
      - name: Install checksummed reference prover
        run: |
          curl --fail --location --proto '=https' --tlsv1.2 https://github.com/tlaplus/tlapm/releases/download/1.6.0-pre/tlapm-1.6.0-pre-x86_64-linux-gnu.tar.gz -o /tmp/tlapm.tar.gz
          echo '3357e45d1142346fb27dbcdbaee05ed4dcb0378cc99e0eb14636c762158aee8d  /tmp/tlapm.tar.gz' | sha256sum --check
          mkdir reference-prover
          tar -xzf /tmp/tlapm.tar.gz -C reference-prover
          reference-prover/tlapm/bin/tlapm --version
      - name: Record strict reference proofs
        working-directory: tla
        run: |
          python3 reference_proofs.py ../reference-tlapm --prover ../reference-prover/tlapm/bin/tlapm -I ../reference-community/modules --shard ${{ matrix.shard }} --shards 4 --report ../reference-proof-report/${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tlaps-reference-proof-${{ matrix.shard }}
          path: reference-proof-report/*.json
          if-no-files-found: warn
