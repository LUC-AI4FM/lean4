name: TLA upstream compatibility
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: tlaplus/Examples
          ref: 0e32a039a4286cc3e1b0f70c00eaff3178d49f85
          path: reference-examples
      - uses: actions/checkout@v5
        with:
          repository: tlaplus/CommunityModules
          ref: 1805e9d5e1cef05d74806309fb87788e69b48f26
          path: reference-community
      - name: Install elan
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build port
        working-directory: tla/universal
        run: |
          lake update
          lake exe cache get
          lake build
          python3 ../tools.py
      - name: Check unchanged modules
        working-directory: tla
        run: |
          python3 compatibility.py ../reference-examples -I ../reference-community/modules -I tests/corpus/tlaps -I tests/corpus/support --shard ${{ matrix.shard }} --shards 4 --report ../compatibility-report/${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tla-compatibility-${{ matrix.shard }}
          path: compatibility-report/*.json
          if-no-files-found: warn
